[project]
name = "intelligent-document-processing"
version = "1.0.0"
description = "End-to-end Intelligent Document Processing: OCR + LLM extraction (Gemini, Groq or any OpenAI-compatible API), validation, confidence scoring, human review, batch processing and CSV/Excel export."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["samples", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008", "UP007", "UP042", "SIM102", "SIM108", "B905", "E501"]

[tool.coverage.run]
source = ["app"]
