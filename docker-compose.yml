services:
  api:
    build: .
    image: idp-system:latest
    container_name: idp-api
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
    ports:
      - "8000:8000"
    volumes:
      - idp-data:/data
    restart: unless-stopped

  ui:
    image: idp-system:latest
    container_name: idp-ui
    command: >
      streamlit run ui/app.py --server.port 8501 --server.address 0.0.0.0
      --server.headless true --browser.gatherUsageStats false --server.maxUploadSize 200
    environment:
      API_URL: http://api:8000
      API_KEY: ${API_KEY:-}
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  idp-data:
